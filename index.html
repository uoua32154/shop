<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>DevMarket.ru — Заказ ПО</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --bg:#020617; --card:#0f172a; --acc:#3b82f6; --text:#f8fafc; --border:#1e293b; }
        body { background:var(--bg); color:var(--text); font-family:system-ui; margin:0; padding:15px; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:15px; margin-bottom:12px; }
        .status-pill { padding:4px 10px; border-radius:20px; font-size:12px; font-weight:bold; background:rgba(59,130,246,0.1); color:var(--acc); }
        input, textarea { width:100%; padding:10px; margin:8px 0; background:var(--bg); border:1px solid var(--border); color:white; border-radius:8px; box-sizing:border-box; }
        button { background:var(--acc); color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold; width:100%; }
        .chat-msg { margin:5px 0; font-size:14px; }
        .owner-msg { color:#fbbf24; } .bot-msg { color:#10b981; }
    </style>
</head>
<body>
    <div id="v-auth" class="card">
        <h2>🚀 DevMarket.ru</h2>
        <input id="email" type="email" placeholder="Ваш Email">
        <button onclick="sendOTP()">Войти по коду</button>
        <div id="otp-box" style="display:none; margin-top:10px;">
            <input id="otp" placeholder="Код из письма">
            <button onclick="verifyOTP()" style="background:#10b981">Подтвердить</button>
        </div>
    </div>

    <div id="v-app" style="display:none;">
        <div class="card" id="shop-form">
            <h3>➕ Создать заказ</h3>
            <input id="title" placeholder="Название программы">
            <textarea id="desc" placeholder="Описание ТЗ..."></textarea>
            <input id="price" type="number" placeholder="Бюджет (₽)">
            <button onclick="createOrder()">Отправить заказ</button>
        </div>
        <div id="orders-list"></div>
    </div>

<script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "sb_publishable_uBcy11J9EcLK2ApPOkGM2Q_qBIyYVB8";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let userEmail = "";

    async function sendOTP() {
        const { error } = await sb.auth.signInWithOtp({ email: document.getElementById('email').value });
        if (!error) document.getElementById('otp-box').style.display='block';
    }

    async function verifyOTP() {
        const { data, error } = await sb.auth.verifyOtp({ 
            email: document.getElementById('email').value, 
            token: document.getElementById('otp').value, type: 'email' 
        });
        if (data.user) {
            userEmail = data.user.email;
            document.getElementById('v-auth').style.display='none';
            document.getElementById('v-app').style.display='block';
            loadOrders();
            // ВКЛЮЧАЕМ REALTIME
            sb.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
                loadOrders();
            }).subscribe();
        }
    }

    async function createOrder() {
        await sb.from('orders').insert([{
            client_email: userEmail,
            title: document.getElementById('title').value,
            description: document.getElementById('desc').value,
            price: parseInt(document.getElementById('price').value),
            chat_json: JSON.stringify([{sender:'bot', text:'Заказ принят! ИИ анализирует ТЗ...'}])
        }]);
    }

    async function loadOrders() {
        const { data } = await sb.from('orders').select('*').order('id', {ascending:false});
        const isAdmin = userEmail === "aperture_portal_2@mail.ru";
        const list = isAdmin ? data : data.filter(o => o.client_email === userEmail);
        
        document.getElementById('orders-list').innerHTML = list.map(o => `
            <div class="card">
                <div style="display:flex; justify-content:space-between">
                    <b>#${o.id} ${o.title}</b>
                    <span class="status-pill">${o.order_status}</span>
                </div>
                <p style="font-size:13px; color:#94a3b8">${o.description}</p>
                <div style="font-weight:bold; color:#10b981">${o.price} ₽</div>
                ${isAdmin ? `<button onclick="updateStatus(${o.id}, 'В работе')" style="width:auto; padding:5px; margin-top:5px;">Начать работу</button>` : ''}
            </div>
        `).join('') || "Заказов нет";
    }

    async function updateStatus(id, st) {
        await sb.from('orders').update({ order_status: st }).eq('id', id);
    }
</script>
</body>
</html>
